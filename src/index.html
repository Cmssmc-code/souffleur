<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Souffleur — copilote d’entretien</title>
<meta name="description" content="Souffleur, votre copilote d’entretien d’embauche : préparation par IA, réponses instantanées pendant vos appels Meet ou Teams, entraînement et récapitulatif.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="Souffleur">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
/* Thème appliqué avant le premier affichage (évite le flash clair en mode sombre). */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('souffleur.settings') || '{}');
    var t = s.theme;
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    if (s.fontScale) document.documentElement.style.setProperty('--font-scale', String(s.fontScale));
  } catch (e) { /* rien */ }
})();
</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="screens.css">
