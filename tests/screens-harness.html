    shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', 'wifi-off': 'M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 5-2.6M14.5 10a10 10 0 0 1 4.5 2.5M2 8.8a15 15 0 0 1 4.5-2.6M12 20h.01', home: 'M3 11l9-8 9 8M5 10v10h14V10', edit: 'M4 20h4L19 9l-4-4L4 16zM14 6l4 4'
  };
  const icon = (n) => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n] || 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z'}"/></svg>`;
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = String(html).trim(); return t.content.firstElementChild; };
  let toastsBox = null;
  function toast(msg, kind) {
    if (!toastsBox) { toastsBox = h('<div class="hx-toasts"></div>'); document.body.appendChild(toastsBox); }
    const el = h(`<div class="hx-toast" data-kind="${kind || 'info'}"></div>`); el.textContent = msg; toastsBox.appendChild(el);
    window.__toasts = (window.__toasts || []).concat({ msg, kind });
    setTimeout(() => el.remove(), 3500);
  }
  S.bus.on('toast', (t) => toast(t.msg, t.kind));
  function sheet(o) {
    const ov = h(`<div class="hx-overlay"><div class="hx-sheet glass card" role="dialog" aria-modal="true"><div class="hx-sheet-head"><div class="h3">${U.esc(o.title || '')}</div><button class="icon-btn" data-x aria-label="Fermer">${icon('xmark')}</button></div><div class="hx-sheet-body"></div><div class="hx-sheet-actions"></div></div></div>`);
    const body = ov.querySelector('.hx-sheet-body');
    if (o.body instanceof Element) body.appendChild(o.body); else body.innerHTML = o.body || '';
    const act = ov.querySelector('.hx-sheet-actions');
    const close = () => ov.remove();
    (o.actions || []).forEach((a) => { const b = h(`<button class="btn btn-${a.kind === 'primary' ? 'primary' : a.kind === 'danger' ? 'danger' : 'ghost'}">${U.esc(a.label)}</button>`); b.onclick = () => { a.onClick && a.onClick(); if (a.close !== false) close(); }; act.appendChild(b); });
    if (!(o.actions || []).length) act.remove();
    ov.querySelector('[data-x]').onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
    return { el: ov, close };
  }
  function confirm(o) {
    return new Promise((res) => {
      let done = false; const fin = (v) => { if (!done) { done = true; res(v); } };
      sheet({ title: o.title, body: `<p>${U.esc(o.text || '')}</p>`, actions: [{ label: 'Annuler', kind: 'ghost', onClick: () => fin(false) }, { label: o.okLabel || 'OK', kind: o.danger ? 'danger' : 'primary', onClick: () => fin(true) }] });
    });
  }
  S.ui = { icon, h, sheet, confirm, toast, relTime: (d) => new Date(d).toLocaleString('fr-FR') };

  /* ---------- S.app (routeur minimal) ---------- */
  const routes = {};
  let current = null;
  function parse() { const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent); return { name: parts[0] || '', params: { id: parts[1] || '', sessionId: parts[2] || '' } }; }
  function route() {
    const r = parse(); if (current && current.leave) current.leave();
    current = routes[r.name] || null;
    const root = document.getElementById('app');
    if (!current) { root.innerHTML = `<div class="sc-body" style="padding:40px"><div class="h1">Accueil (stub)</div><p class="muted">Route « ${U.esc(r.name)} »</p></div>`; return; }
    current.render(root, r.params);
  }
  S.app = { register(n, def) { routes[n] = def; }, go(hash) { if (location.hash === hash) route(); else location.hash = hash; }, params: () => parse().params };
  window.addEventListener('hashchange', route);
  document.addEventListener('DOMContentLoaded', () => setTimeout(route, 0));
})(window.Souffleur);
</script>
